<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Thocow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #70c5ce;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #game-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: linear-gradient(#87ceeb 0%, #b8e0e8 60%, #c8e6a0 100%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="400" height="640"></canvas>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Scale canvas to fit window while keeping aspect ratio
  function resize() {
    const ratio = W / H;
    const wRatio = window.innerWidth / window.innerHeight;
    let cssW, cssH;
    if (wRatio > ratio) {
      cssH = window.innerHeight;
      cssW = cssH * ratio;
    } else {
      cssW = window.innerWidth;
      cssH = cssW / ratio;
    }
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- AUDIO ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
  }
  function beep(freq, duration, type = 'square', vol = 0.15) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }
  const sfx = {
    flap: () => beep(420, 0.08, 'square', 0.12),
    score: () => { beep(880, 0.07, 'triangle', 0.18); setTimeout(() => beep(1320, 0.1, 'triangle', 0.18), 60); },
    hit: () => beep(120, 0.25, 'sawtooth', 0.25),
    die: () => { beep(220, 0.2, 'sawtooth', 0.2); setTimeout(() => beep(110, 0.4, 'sawtooth', 0.2), 180); },
  };

  // ---------- GAME STATE ----------
  const STATE = { READY: 0, PLAYING: 1, GAMEOVER: 2 };
  let state = STATE.READY;
  let score = 0;

  const DIFFICULTIES = {
    izi: {
      name: 'IZI',
      baseSpeed: 3.6,
      speedPerPoint: 0.18,
      maxSpeed: 10.0,
      pipeMinSpacing: 380,
      pipeMaxSpacing: 380,       // fixed pacing
      pipeGap: 180,
      night: false,
      fire: false,
    },
    omega: {
      name: 'OMEGA DEDOS',
      baseSpeed: 6.2,
      speedPerPoint: 0.22,
      maxSpeed: 13.5,
      pipeMinSpacing: 280,       // tight bursts
      pipeMaxSpacing: 480,       // breathers
      pipeGap: 200,
      night: true,
      fire: true,
    },
  };
  let difficulty = 'izi';
  function diff() { return DIFFICULTIES[difficulty]; }

  function bestKey() { return 'thocow_best_' + difficulty; }
  let best = +(localStorage.getItem(bestKey()) || 0);

  const GRAVITY = 0.32;
  const FLAP = -6.5;
  const MAX_FALL = 9;
  const PIPE_WIDTH = 70;
  const GROUND_H = 90;

  function currentSpeed() {
    const d = diff();
    return Math.min(d.maxSpeed, d.baseSpeed + score * d.speedPerPoint);
  }

  const cow = {
    x: 110,
    y: H / 2,
    w: 46,
    h: 34,
    vy: 0,
    rot: 0,
    wing: 0,
  };

  let pipes = [];
  let clouds = [];
  let grassOffset = 0;
  let frame = 0;

  function reset() {
    cow.x = 110;
    cow.y = H / 2;
    cow.vy = 0;
    cow.rot = 0;
    pipes = [];
    score = 0;
    frame = 0;
    spawnInitialPipes();
  }

  function spawnInitialPipes() {
    const d = diff();
    let x = W + 100;
    for (let i = 0; i < 3; i++) {
      addPipe(x);
      x += d.pipeMinSpacing + Math.random() * (d.pipeMaxSpacing - d.pipeMinSpacing);
    }
  }

  function addPipe(x) {
    const gap = diff().pipeGap;
    const minTop = 60;
    const maxTop = H - GROUND_H - gap - 60;
    const minCenterAbs = minTop + gap / 2;
    const maxCenterAbs = maxTop + gap / 2;

    let top;
    const prev = pipes[pipes.length - 1];
    if (prev) {
      // Constrain vertical change so the cow can physically reach the new gap.
      // Allowed delta scales with horizontal spacing (more time → bigger reachable range).
      const spacing = x - prev.x;
      const prevCenter = prev.top + gap / 2;
      const maxDelta = Math.max(60, spacing * 0.4);
      const minC = Math.max(minCenterAbs, prevCenter - maxDelta);
      const maxC = Math.min(maxCenterAbs, prevCenter + maxDelta);
      const center = minC + Math.random() * (maxC - minC);
      top = center - gap / 2;
    } else {
      top = minTop + Math.random() * (maxTop - minTop);
    }
    pipes.push({ x, top, passed: false });
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 40 + Math.random() * 180,
        s: 0.6 + Math.random() * 0.8,
        speed: 0.2 + Math.random() * 0.3,
      });
    }
  }
  initClouds();

  // Stars for night mode
  let stars = [];
  function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (H - GROUND_H - 80),
        r: 0.5 + Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }
  initStars();

  // ---------- INPUT ----------
  // Title-screen buttons (canvas coords)
  const BTN_IZI   = { x: W / 2 - 110, y: 320, w: 220, h: 56, key: 'izi' };
  const BTN_OMEGA = { x: W / 2 - 110, y: 400, w: 220, h: 56, key: 'omega' };

  function pointInRect(x, y, r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  function eventToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top)  * (H / rect.height),
    };
  }

  function selectDifficulty(key) {
    difficulty = key;
    best = +(localStorage.getItem(bestKey()) || 0);
    reset();
    state = STATE.PLAYING;
    cow.vy = FLAP;
    sfx.flap();
  }

  function handleTap(clientX, clientY) {
    ensureAudio();
    if (state === STATE.READY) {
      const p = eventToCanvas(clientX, clientY);
      if (pointInRect(p.x, p.y, BTN_IZI))   { selectDifficulty('izi');   return; }
      if (pointInRect(p.x, p.y, BTN_OMEGA)) { selectDifficulty('omega'); return; }
      // Tap anywhere else on READY does nothing — must pick a difficulty
    } else if (state === STATE.PLAYING) {
      cow.vy = FLAP;
      cow.wing = 1;
      sfx.flap();
    } else if (state === STATE.GAMEOVER) {
      if (gameOverTimer > 30) {
        reset();
        state = STATE.READY;
      }
    }
  }

  window.addEventListener('mousedown', e => {
    e.preventDefault();
    handleTap(e.clientX, e.clientY);
  });
  window.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0] || e.changedTouches[0];
    if (t) handleTap(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (state === STATE.READY) {
        // keyboard quick-start defaults to current selection
        selectDifficulty(difficulty);
      } else if (state === STATE.PLAYING) {
        cow.vy = FLAP;
        cow.wing = 1;
        sfx.flap();
      } else if (state === STATE.GAMEOVER && gameOverTimer > 30) {
        reset();
        state = STATE.READY;
      }
    }
  });

  let gameOverTimer = 0;

  // ---------- UPDATE ----------
  function update() {
    frame++;

    // clouds always move
    for (const c of clouds) {
      c.x -= c.speed;
      if (c.x < -60) { c.x = W + 40; c.y = 40 + Math.random() * 180; c.s = 0.6 + Math.random() * 0.8; }
    }

    if (state === STATE.READY) {
      // gentle hover
      cow.y = H / 2 + Math.sin(frame * 0.08) * 6;
      cow.rot = Math.sin(frame * 0.08) * 0.05;
      return;
    }

    if (state === STATE.PLAYING) {
      cow.vy += GRAVITY;
      if (cow.vy > MAX_FALL) cow.vy = MAX_FALL;
      cow.y += cow.vy;
      cow.rot = Math.max(-0.5, Math.min(1.4, cow.vy * 0.08));

      const speed = currentSpeed();
      grassOffset = (grassOffset + speed) % 30;

      // move pipes
      for (const p of pipes) p.x -= speed;

      // recycle / spawn pipes
      const d = diff();
      const minSp = d.pipeMinSpacing;
      const maxSp = d.pipeMaxSpacing;
      if (pipes.length && pipes[0].x + PIPE_WIDTH < -20) pipes.shift();
      const last = pipes[pipes.length - 1];
      if (!last) {
        addPipe(W + 100);
      } else if (last.x <= W - minSp) {
        // pick a random spacing in [minSp, maxSp]; clamp so the new pipe
        // never lands on-screen, even if the previous one overshot
        const wanted = minSp + Math.random() * (maxSp - minSp);
        const newX = Math.max(W, last.x + wanted);
        addPipe(newX);
      }

      // scoring
      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_WIDTH < cow.x) {
          p.passed = true;
          score++;
          if (score > best) {
            best = score;
            localStorage.setItem(bestKey(), best);
          }
          sfx.score();
        }
      }

      // collisions
      if (cow.y + cow.h / 2 > H - GROUND_H) {
        cow.y = H - GROUND_H - cow.h / 2;
        die();
      } else if (cow.y - cow.h / 2 < 0) {
        cow.y = cow.h / 2;
        cow.vy = 0;
      }

      for (const p of pipes) {
        if (collides(cow, p)) { die(); break; }
      }

      cow.wing = Math.max(0, cow.wing - 0.06);
    }

    if (state === STATE.GAMEOVER) {
      gameOverTimer++;
      if (cow.y + cow.h / 2 < H - GROUND_H) {
        cow.vy += GRAVITY;
        cow.y += cow.vy;
        cow.rot = Math.min(1.5, cow.rot + 0.06);
      } else {
        cow.y = H - GROUND_H - cow.h / 2;
      }
    }
  }

  function collides(c, p) {
    const gap = diff().pipeGap;
    const cx1 = c.x - c.w / 2 + 4;
    const cx2 = c.x + c.w / 2 - 4;
    const cy1 = c.y - c.h / 2 + 4;
    const cy2 = c.y + c.h / 2 - 4;
    const px1 = p.x;
    const px2 = p.x + PIPE_WIDTH;
    if (cx2 < px1 || cx1 > px2) return false;
    if (cy1 < p.top) return true;
    if (cy2 > p.top + gap) return true;
    return false;
  }

  function die() {
    if (state !== STATE.PLAYING) return;
    state = STATE.GAMEOVER;
    gameOverTimer = 0;
    sfx.hit();
    setTimeout(() => sfx.die(), 150);
  }

  // ---------- RENDER ----------
  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y + 4 * s, 14 * s, 0, Math.PI * 2);
    ctx.arc(x - 18 * s, y + 4 * s, 14 * s, 0, Math.PI * 2);
    ctx.arc(x + 6 * s, y - 10 * s, 12 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    const night = diff().night;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (night) {
      g.addColorStop(0, '#0a0a2e');
      g.addColorStop(0.5, '#1a1448');
      g.addColorStop(1, '#3a1a3a');
    } else {
      g.addColorStop(0, '#87ceeb');
      g.addColorStop(0.65, '#b8e0e8');
      g.addColorStop(1, '#d6efb0');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (night) {
      // stars
      for (const s of stars) {
        const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(frame * 0.05 + s.phase));
        ctx.fillStyle = `rgba(255, 255, 230, ${tw})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      // moon
      ctx.save();
      ctx.shadowColor = 'rgba(255,240,200,0.6)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff4cf';
      ctx.beginPath();
      ctx.arc(W - 70, 90, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // crescent shadow
      ctx.fillStyle = '#1a1448';
      ctx.beginPath();
      ctx.arc(W - 60, 84, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // distant hills
    ctx.fillStyle = night ? '#2a1a3a' : '#8ec56b';
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_H - 30);
    for (let x = 0; x <= W; x += 40) {
      const y = H - GROUND_H - 30 - Math.sin(x * 0.02) * 18 - 12;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H - GROUND_H);
    ctx.lineTo(0, H - GROUND_H);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = night ? '#1a0f24' : '#7ab85a';
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_H - 15);
    for (let x = 0; x <= W; x += 30) {
      const y = H - GROUND_H - 15 - Math.cos(x * 0.03 + 1) * 12 - 6;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H - GROUND_H);
    ctx.lineTo(0, H - GROUND_H);
    ctx.closePath();
    ctx.fill();

    if (!night) {
      // clouds only in day mode
      for (const c of clouds) drawCloud(c.x, c.y, c.s);
    }
  }

  function drawGround() {
    const night = diff().night;
    // grass top
    ctx.fillStyle = night ? '#2d4422' : '#6ab04c';
    ctx.fillRect(0, H - GROUND_H, W, 14);
    // grass blade pattern
    ctx.fillStyle = night ? '#1f3318' : '#5aa03c';
    for (let x = -grassOffset; x < W; x += 12) {
      ctx.fillRect(x, H - GROUND_H + 10, 6, 4);
    }
    // dirt
    const dg = ctx.createLinearGradient(0, H - GROUND_H + 14, 0, H);
    if (night) {
      dg.addColorStop(0, '#4a3320');
      dg.addColorStop(1, '#2a1d12');
    } else {
      dg.addColorStop(0, '#c69c6d');
      dg.addColorStop(1, '#8a6240');
    }
    ctx.fillStyle = dg;
    ctx.fillRect(0, H - GROUND_H + 14, W, GROUND_H - 14);
    // dirt specks
    ctx.fillStyle = night ? 'rgba(20,12,5,0.5)' : 'rgba(80,55,30,0.4)';
    for (let i = 0; i < 20; i++) {
      const sx = ((i * 53 - grassOffset * 1.5) % W + W) % W;
      const sy = H - GROUND_H + 24 + (i % 5) * 12;
      ctx.fillRect(sx, sy, 3, 2);
    }
  }

  // Wooden fence obstacle (replaces flappy pipe)
  function drawFence(p) {
    const d = diff();
    const gap = d.pipeGap;
    drawFenceSegment(p.x, 0, PIPE_WIDTH, p.top, true);            // top hangs from sky
    drawFenceSegment(p.x, p.top + gap, PIPE_WIDTH, H - GROUND_H - (p.top + gap), false);

    if (d.fire) {
      // flames on gap-facing edges
      drawFlames(p.x - 4, p.top, PIPE_WIDTH + 8, +1);              // top fence — flames lick down
      drawFlames(p.x - 4, p.top + gap, PIPE_WIDTH + 8, -1);        // bottom fence — flames rise up
    }
  }

  function drawFlames(x, edgeY, w, dir) {
    // dir: -1 = flames extend upward from edgeY (bottom fence top edge)
    //      +1 = flames extend downward from edgeY (top fence bottom edge)
    const flameCount = 7;
    const flameW = w / flameCount;
    const t = frame * 0.18;

    for (let i = 0; i < flameCount; i++) {
      const cx = x + i * flameW + flameW / 2;
      const flicker = 0.5 + 0.5 * (Math.sin(t + i * 1.7) * 0.5 + Math.sin(t * 1.4 + i * 0.9) * 0.5);
      const baseH = 22 + flicker * 14;

      // outer flame (orange) with glow
      ctx.save();
      ctx.shadowColor = 'rgba(255,120,30,0.7)';
      ctx.shadowBlur = 12;
      drawFlameShape(cx, edgeY, flameW * 1.05, baseH, dir, '#ff6a1a');
      ctx.restore();
      // mid flame (yellow-orange)
      drawFlameShape(cx, edgeY, flameW * 0.75, baseH * 0.78, dir, '#ffb830');
      // inner flame (yellow)
      drawFlameShape(cx, edgeY, flameW * 0.5, baseH * 0.55, dir, '#ffe680');
      // core (near-white)
      drawFlameShape(cx, edgeY, flameW * 0.28, baseH * 0.32, dir, '#ffffd0');
    }

    // floating embers
    for (let i = 0; i < 4; i++) {
      const seed = i * 37 + (frame * 0.6 | 0);
      const px = x + ((seed * 53) % w);
      const offset = ((frame * 1.3 + i * 41) % 60);
      const py = edgeY + dir * -offset; // embers drift toward the gap
      const a = 1 - offset / 60;
      ctx.fillStyle = `rgba(255, ${160 + (i*30)%80}, 60, ${a * 0.8})`;
      ctx.beginPath();
      ctx.arc(px, py, 1.4 + (i % 2) * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFlameShape(cx, baseY, w, h, dir, color) {
    // draw teardrop-ish flame: wide at base, pointy at tip
    const tipY = baseY + dir * h;
    const halfW = w / 2;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx - halfW, baseY);
    // left side curve to tip
    ctx.bezierCurveTo(
      cx - halfW * 0.7, baseY + dir * h * 0.55,
      cx - halfW * 0.2, baseY + dir * h * 0.85,
      cx, tipY
    );
    // right side curve back to base
    ctx.bezierCurveTo(
      cx + halfW * 0.2, baseY + dir * h * 0.85,
      cx + halfW * 0.7, baseY + dir * h * 0.55,
      cx + halfW, baseY
    );
    ctx.closePath();
    ctx.fill();
  }

  function drawFenceSegment(x, y, w, h, flipped) {
    if (h <= 0) return;
    ctx.save();
    // wood color
    const woodLight = '#d4a574';
    const woodMid = '#b58456';
    const woodDark = '#7a5535';
    const woodEdge = '#5a3d24';

    // horizontal rails (2 thick planks)
    const railH = 10;
    const railGap = 18;
    const railTop1 = flipped ? y + h - railGap - railH * 2 - 6 : y + 8;
    const railTop2 = flipped ? y + h - railH - 4 : y + 8 + railH + railGap;

    // vertical posts (3 across the width)
    const postW = 12;
    const postCount = 3;
    const postSpacing = (w - postW * postCount) / (postCount + 1);

    // draw posts first
    for (let i = 0; i < postCount; i++) {
      const px = x + postSpacing + i * (postW + postSpacing);
      const grad = ctx.createLinearGradient(px, 0, px + postW, 0);
      grad.addColorStop(0, woodDark);
      grad.addColorStop(0.5, woodMid);
      grad.addColorStop(1, woodDark);
      ctx.fillStyle = grad;
      ctx.fillRect(px, y, postW, h);

      // wood grain
      ctx.fillStyle = 'rgba(90,55,25,0.35)';
      ctx.fillRect(px + 3, y, 1, h);
      ctx.fillRect(px + 8, y, 1, h);

      // pointy top (only on the "outer" end of each post)
      if (flipped) {
        // post end at bottom of segment (pointing down toward gap)
        ctx.fillStyle = woodMid;
        ctx.beginPath();
        ctx.moveTo(px, y);
        ctx.lineTo(px + postW / 2, y - 8);
        ctx.lineTo(px + postW, y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = woodEdge;
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        // post end at top of segment (pointing up toward gap)
        ctx.fillStyle = woodMid;
        ctx.beginPath();
        ctx.moveTo(px, y);
        ctx.lineTo(px + postW / 2, y - 8);
        ctx.lineTo(px + postW, y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = woodEdge;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // horizontal rails (drawn after posts to overlap)
    function drawRail(ry) {
      if (ry < y || ry + railH > y + h) return;
      const g = ctx.createLinearGradient(0, ry, 0, ry + railH);
      g.addColorStop(0, woodLight);
      g.addColorStop(0.5, woodMid);
      g.addColorStop(1, woodDark);
      ctx.fillStyle = g;
      ctx.fillRect(x - 2, ry, w + 4, railH);
      // wood grain
      ctx.fillStyle = 'rgba(90,55,25,0.3)';
      ctx.fillRect(x - 2, ry + 3, w + 4, 1);
      ctx.fillRect(x - 2, ry + 7, w + 4, 1);
      // dark edge
      ctx.fillStyle = woodEdge;
      ctx.fillRect(x - 2, ry + railH - 1, w + 4, 1);
    }
    drawRail(railTop1);
    drawRail(railTop2);

    // chunky end cap at the open end (toward the gap)
    const capY = flipped ? y : y + h - 6;
    ctx.fillStyle = woodDark;
    ctx.fillRect(x - 4, capY, w + 8, 6);
    ctx.fillStyle = woodEdge;
    ctx.fillRect(x - 4, capY + 5, w + 8, 1);

    ctx.restore();
  }

  // Adorable cow
  function drawCow() {
    ctx.save();
    ctx.translate(cow.x, cow.y);
    ctx.rotate(cow.rot);

    const w = cow.w;
    const h = cow.h;

    // shadow underneath
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(0, h / 2 + 4, w / 2.2, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // body (white rounded rectangle)
    ctx.fillStyle = '#ffffff';
    roundRect(-w / 2, -h / 2, w, h, 12, true, false);

    // body outline
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1.5;
    roundRect(-w / 2, -h / 2, w, h, 12, false, true);

    // black spots
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath();
    ctx.ellipse(-6, -2, 7, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(6, 6, 5, 4, 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-14, 8, 4, 3, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // legs (little stubs hanging below)
    ctx.fillStyle = '#2a1a10';
    ctx.fillRect(-12, h / 2 - 2, 4, 6);
    ctx.fillRect(6, h / 2 - 2, 4, 6);
    // hooves
    ctx.fillRect(-13, h / 2 + 3, 6, 2);
    ctx.fillRect(5, h / 2 + 3, 6, 2);

    // tail (back-left)
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-w / 2, -2);
    ctx.quadraticCurveTo(-w / 2 - 8, 2, -w / 2 - 6, 8);
    ctx.stroke();
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath();
    ctx.arc(-w / 2 - 6, 9, 3, 0, Math.PI * 2);
    ctx.fill();

    // head (front-right, slightly overlapping body)
    const headX = w / 2 - 4;
    const headY = -h / 2 + 6;
    // ears
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(headX - 4, headY - 7, 4, 6, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(headX + 8, headY - 7, 4, 6, 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // inner ear pink
    ctx.fillStyle = '#f5b3c0';
    ctx.beginPath();
    ctx.ellipse(headX - 4, headY - 6, 1.6, 3, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(headX + 8, headY - 6, 1.6, 3, 0.4, 0, Math.PI * 2);
    ctx.fill();

    // horns
    ctx.fillStyle = '#e8d29a';
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(headX - 1, headY - 10, 2, 4, -0.3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(headX + 5, headY - 10, 2, 4, 0.3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // head circle (white)
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(headX + 2, headY, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // black spot on head
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath();
    ctx.ellipse(headX - 2, headY - 3, 4, 3, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // snout (pink)
    ctx.fillStyle = '#f5b3c0';
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(headX + 5, headY + 4, 6, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // nostrils
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath(); ctx.arc(headX + 3, headY + 4, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(headX + 7, headY + 4, 0.9, 0, Math.PI * 2); ctx.fill();

    // eye
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(headX + 5, headY - 2, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath();
    ctx.arc(headX + 6, headY - 2, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(headX + 6.4, headY - 2.5, 0.5, 0, Math.PI * 2);
    ctx.fill();

    // wing (flapping)
    const wingAngle = -0.6 + cow.wing * 1.4;
    ctx.save();
    ctx.translate(-2, -2);
    ctx.rotate(wingAngle);
    ctx.fillStyle = '#fff7d6';
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // feather lines
    ctx.beginPath();
    ctx.moveTo(-4, 0); ctx.lineTo(-9, 3);
    ctx.moveTo(0, 0); ctx.lineTo(-2, 5);
    ctx.moveTo(4, 0); ctx.lineTo(6, 4);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function drawScore() {
    if (state === STATE.PLAYING || state === STATE.GAMEOVER) {
      drawBigNumber(score, W / 2, 90);
    }
  }

  function drawBigNumber(n, cx, cy) {
    ctx.save();
    ctx.font = 'bold 56px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = String(n);
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText(text, cx, cy);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, cx, cy);
    ctx.restore();
  }

  function drawTitle() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Title
    const y = 130;
    ctx.font = 'bold 72px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText('THOCOW', W / 2, y);
    const grad = ctx.createLinearGradient(0, y - 30, 0, y + 30);
    grad.addColorStop(0, '#fff8c4');
    grad.addColorStop(1, '#f5b3c0');
    ctx.fillStyle = grad;
    ctx.fillText('THOCOW', W / 2, y);

    // subtitle
    ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeText('A vaquinha voadora', W / 2, y + 44);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('A vaquinha voadora', W / 2, y + 44);

    // "escolha sua dificuldade"
    ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText('escolha sua dificuldade', W / 2, 285);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('escolha sua dificuldade', W / 2, 285);

    // Buttons
    drawButton(BTN_IZI, 'IZI', '#a8e063', '#5ba83a', false);
    drawButton(BTN_OMEGA, 'OMEGA DEDOS', '#ff5722', '#8a1500', true);

    ctx.restore();
  }

  function drawButton(btn, label, colorTop, colorBottom, hot) {
    ctx.save();
    // pulse for hot button
    const pulse = hot ? 1 + Math.sin(frame * 0.15) * 0.04 : 1;
    const cx = btn.x + btn.w / 2;
    const cy = btn.y + btn.h / 2;
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    ctx.translate(-cx, -cy);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(btn.x + 3, btn.y + 5, btn.w, btn.h, 14, true, false);

    // body gradient
    const g = ctx.createLinearGradient(0, btn.y, 0, btn.y + btn.h);
    g.addColorStop(0, colorTop);
    g.addColorStop(1, colorBottom);
    ctx.fillStyle = g;
    roundRect(btn.x, btn.y, btn.w, btn.h, 14, true, false);

    // border
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 3;
    roundRect(btn.x, btn.y, btn.w, btn.h, 14, false, true);

    // inner highlight stripe
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    roundRect(btn.x + 6, btn.y + 5, btn.w - 12, 10, 6, true, false);

    // tiny flame icons next to OMEGA label
    if (hot) {
      drawTinyFlame(btn.x + 28, cy);
      drawTinyFlame(btn.x + btn.w - 28, cy);
    }

    // label
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText(label, cx, cy + 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, cx, cy + 1);

    ctx.restore();
  }

  function drawTinyFlame(x, y) {
    ctx.save();
    ctx.shadowColor = 'rgba(255,140,40,0.8)';
    ctx.shadowBlur = 6;
    drawFlameShape(x, y + 8, 12, 16, -1, '#ff6a1a');
    drawFlameShape(x, y + 8, 8, 11, -1, '#ffd84a');
    drawFlameShape(x, y + 8, 4, 6, -1, '#ffffd0');
    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    // dim
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // panel
    const panelW = 280;
    const panelH = 220;
    const panelX = (W - panelW) / 2;
    const panelY = 160;

    ctx.fillStyle = '#fff7d6';
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 4;
    roundRect(panelX, panelY, panelW, panelH, 16, true, true);

    // inner divider
    ctx.fillStyle = '#f5b3c0';
    roundRect(panelX + 14, panelY + 14, panelW - 28, 50, 10, true, false);
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 2;
    roundRect(panelX + 14, panelY + 14, panelW - 28, 50, 10, false, true);

    // GAME OVER
    ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText('MUUUH!', W / 2, panelY + 40);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('MUUUH!', W / 2, panelY + 40);

    // labels
    ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = '#2a1a10';
    ctx.textAlign = 'left';
    ctx.fillText('Pontos', panelX + 30, panelY + 95);
    ctx.fillText('Recorde', panelX + 30, panelY + 135);

    ctx.textAlign = 'right';
    ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = '#2a1a10';
    ctx.fillText(String(score), panelX + panelW - 30, panelY + 95);
    ctx.fillStyle = '#d4a017';
    ctx.fillText(String(best), panelX + panelW - 30, panelY + 135);

    // new record badge
    if (score > 0 && score === best && score > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#d4a017';
      ctx.fillText('NOVO RECORDE!', W / 2, panelY + 165);
    }

    // restart prompt
    if (gameOverTimer > 30) {
      const pulse = 0.5 + Math.sin(frame * 0.15) * 0.5;
      ctx.globalAlpha = 0.5 + pulse * 0.5;
      ctx.textAlign = 'center';
      ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#2a1a10';
      ctx.strokeText('Toque para jogar de novo', W / 2, panelY + panelH + 30);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Toque para jogar de novo', W / 2, panelY + panelH + 30);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function render() {
    drawBackground();
    for (const p of pipes) drawFence(p);
    drawGround();
    drawCow();

    if (state === STATE.READY) drawTitle();
    drawScore();
    if (state === STATE.GAMEOVER) drawGameOver();
  }

  // ---------- LOOP (fixed timestep, frame-rate independent) ----------
  const FIXED_DT = 1000 / 60; // logical update rate: 60 Hz
  let lastTime = performance.now();
  let accumulator = 0;

  function loop(now) {
    let frameTime = now - lastTime;
    lastTime = now;
    // Clamp huge gaps (tab was in background, etc.) to avoid spiral of death
    if (frameTime > 250) frameTime = 250;
    accumulator += frameTime;
    // Catch-up: run as many fixed updates as needed
    let safety = 5;
    while (accumulator >= FIXED_DT && safety-- > 0) {
      update();
      accumulator -= FIXED_DT;
    }
    render();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Thocow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #70c5ce;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #game-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: linear-gradient(#87ceeb 0%, #b8e0e8 60%, #c8e6a0 100%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="400" height="640"></canvas>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Scale canvas to fit window while keeping aspect ratio
  function resize() {
    const ratio = W / H;
    const wRatio = window.innerWidth / window.innerHeight;
    let cssW, cssH;
    if (wRatio > ratio) {
      cssH = window.innerHeight;
      cssW = cssH * ratio;
    } else {
      cssW = window.innerWidth;
      cssH = cssW / ratio;
    }
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- AUDIO ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
  }
  function beep(freq, duration, type = 'square', vol = 0.15) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }
  const sfx = {
    flap: () => beep(420, 0.08, 'square', 0.12),
    score: () => { beep(880, 0.07, 'triangle', 0.18); setTimeout(() => beep(1320, 0.1, 'triangle', 0.18), 60); },
    hit: () => beep(120, 0.25, 'sawtooth', 0.25),
    die: () => { beep(220, 0.2, 'sawtooth', 0.2); setTimeout(() => beep(110, 0.4, 'sawtooth', 0.2), 180); },
    warn: () => {
      // ascending alarm during warning period
      beep(440, 0.08, 'square', 0.14);
      setTimeout(() => beep(550, 0.08, 'square', 0.14), 250);
      setTimeout(() => beep(660, 0.08, 'square', 0.14), 500);
      setTimeout(() => beep(880, 0.1, 'square', 0.16), 750);
    },
    flip: () => {
      // dramatic whoosh: low to high sweep
      beep(110, 0.05, 'sawtooth', 0.22);
      setTimeout(() => beep(660, 0.06, 'sawtooth', 0.22), 40);
      setTimeout(() => beep(330, 0.12, 'triangle', 0.18), 80);
    },
  };

  // ---------- GAME STATE ----------
  const STATE = { READY: 0, PLAYING: 1, GAMEOVER: 2 };
  let state = STATE.READY;
  let score = 0;

  const DIFFICULTIES = {
    izi: {
      name: 'IZI',
      baseSpeed: 3.6,
      speedPerPoint: 0.18,
      maxSpeed: 10.0,
      pipeMinSpacing: 380,
      pipeMaxSpacing: 380,       // fixed pacing
      pipeGap: 180,
      theme: 'day',
      fire: false,
      gravityFlip: false,
    },
    omega: {
      name: 'OMEGA DEDOS',
      baseSpeed: 6.2,
      speedPerPoint: 0.22,
      maxSpeed: 13.5,
      pipeMinSpacing: 280,
      pipeMaxSpacing: 480,
      pipeGap: 200,
      theme: 'night',
      fire: true,
      gravityFlip: false,
    },
    agonist: {
      name: 'AGONIST',
      baseSpeed: 7.5,
      speedPerPoint: 0.26,
      maxSpeed: 15.5,
      pipeMinSpacing: 300,
      pipeMaxSpacing: 460,
      pipeGap: 210,              // a hair more room since gravity flips
      theme: 'hell',
      fire: true,
      gravityFlip: true,
      flipMinFrames: 240,        // 4s @ 60Hz
      flipMaxFrames: 420,        // 7s
      flipWarningFrames: 60,     // 1s warning
    },
  };
  let difficulty = 'izi';
  function diff() { return DIFFICULTIES[difficulty]; }

  function bestKey() { return 'thocow_best_' + difficulty; }
  let best = +(localStorage.getItem(bestKey()) || 0);

  // ---------- SKINS ----------
  const SKINS = {
    classic: {
      name: 'CLÁSSICA',
      body: '#ffffff', outline: '#2a1a10', spots: '#2a1a10', spotShape: 'blob',
      horns: '#e8d29a', hornsStyle: 'normal',
      snout: '#f5b3c0', innerEar: '#f5b3c0', tail: '#2a1a10',
      wing: '#fff7d6', wingOutline: '#2a1a10',
      eye: 'normal', extras: [],
    },
    brown: {
      name: 'JERSEY',
      body: '#a8754c', outline: '#3a200f', spots: '#f5e3c8', spotShape: 'blob',
      horns: '#e8d29a', hornsStyle: 'normal',
      snout: '#e88c75', innerEar: '#e8a888', tail: '#3a200f',
      wing: '#f5deba', wingOutline: '#3a200f',
      eye: 'normal', extras: [],
    },
    robo: {
      name: 'ROBOCOW',
      body: '#c0c8d0', outline: '#1a1f28', spots: '#454e58', spotShape: 'rivets',
      horns: '#8a96a4', hornsStyle: 'antenna',
      snout: '#7a8290', innerEar: '#454e58', tail: '#454e58',
      wing: '#a8b0bc', wingOutline: '#1a1f28',
      eye: 'led-red', extras: ['screws'],
    },
    galaxy: {
      name: 'GALÁXIA',
      body: '#2a1858', outline: '#0a0820', spots: '#ffffff', spotShape: 'star',
      horns: '#fff4cf', hornsStyle: 'normal',
      snout: '#a050d0', innerEar: '#d088f0', tail: '#5a30a0',
      wing: '#d8c0ff', wingOutline: '#0a0820',
      eye: 'glow-cyan', extras: ['sparkle', 'glow'],
    },
    demon: {
      name: 'DIABA',
      body: '#9a1818', outline: '#2a0808', spots: '#3a0808', spotShape: 'blob',
      horns: '#1a0a0a', hornsStyle: 'devil',
      snout: '#3a0808', innerEar: '#5a1010', tail: '#3a0808',
      wing: '#4a0a0a', wingOutline: '#2a0808',
      eye: 'glow-red', extras: ['fire-tail', 'glow-red'],
    },
    unicow: {
      name: 'UNICOW',
      body: '#ffe4f1', outline: '#a04878', spots: '#ff8ab8', spotShape: 'heart',
      horns: '#fff4cf', hornsStyle: 'unicorn',
      snout: '#ffb8d8', innerEar: '#ffc8e0', tail: '#a888ff',
      wing: '#c8a8ff', wingOutline: '#a04878',
      eye: 'normal', extras: ['rainbow-mane', 'sparkle'],
    },
  };
  const SKIN_KEYS = Object.keys(SKINS);
  let currentSkin = localStorage.getItem('thocow_skin') || 'classic';
  if (!SKINS[currentSkin]) currentSkin = 'classic';

  const GRAVITY = 0.32;
  const FLAP = -6.5;
  const MAX_FALL = 9;
  const PIPE_WIDTH = 70;
  const GROUND_H = 90;

  function currentSpeed() {
    const d = diff();
    return Math.min(d.maxSpeed, d.baseSpeed + score * d.speedPerPoint);
  }

  const cow = {
    x: 110,
    y: H / 2,
    w: 46,
    h: 34,
    vy: 0,
    rot: 0,
    wing: 0,
  };

  let pipes = [];
  let clouds = [];
  let grassOffset = 0;
  let frame = 0;

  function reset() {
    cow.x = 110;
    cow.y = H / 2;
    cow.vy = 0;
    cow.rot = 0;
    pipes = [];
    score = 0;
    frame = 0;
    resetGravity();
    spawnInitialPipes();
  }

  function spawnInitialPipes() {
    const d = diff();
    let x = W + 100;
    for (let i = 0; i < 3; i++) {
      addPipe(x);
      x += d.pipeMinSpacing + Math.random() * (d.pipeMaxSpacing - d.pipeMinSpacing);
    }
  }

  function addPipe(x) {
    const gap = diff().pipeGap;
    const minTop = 60;
    const maxTop = H - GROUND_H - gap - 60;
    const minCenterAbs = minTop + gap / 2;
    const maxCenterAbs = maxTop + gap / 2;

    let top;
    const prev = pipes[pipes.length - 1];
    if (prev) {
      // Constrain vertical change so the cow can physically reach the new gap.
      // Allowed delta scales with horizontal spacing (more time → bigger reachable range).
      const spacing = x - prev.x;
      const prevCenter = prev.top + gap / 2;
      const maxDelta = Math.max(60, spacing * 0.4);
      const minC = Math.max(minCenterAbs, prevCenter - maxDelta);
      const maxC = Math.min(maxCenterAbs, prevCenter + maxDelta);
      const center = minC + Math.random() * (maxC - minC);
      top = center - gap / 2;
    } else {
      top = minTop + Math.random() * (maxTop - minTop);
    }
    pipes.push({ x, top, passed: false });
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 40 + Math.random() * 180,
        s: 0.6 + Math.random() * 0.8,
        speed: 0.2 + Math.random() * 0.3,
      });
    }
  }
  initClouds();

  // Stars for night mode
  let stars = [];
  function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (H - GROUND_H - 80),
        r: 0.5 + Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }
  initStars();

  // Embers for hell mode
  let embers = [];
  function initEmbers() {
    embers = [];
    for (let i = 0; i < 60; i++) {
      embers.push({
        x: Math.random() * W,
        y: Math.random() * (H - GROUND_H),
        r: 0.6 + Math.random() * 1.8,
        speed: 0.4 + Math.random() * 0.8,
        sway: 0.5 + Math.random() * 1.0,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }
  initEmbers();

  // ---------- AGONIST: gravity flip state ----------
  let gravityDir = 1;       // +1 down (normal), -1 up (inverted)
  let nextFlipFrame = 0;    // frame at which gravity will flip
  let warningActive = false;
  let warnedAt = -1;        // frame the latest warning began (-1 = none)

  function resetGravity() {
    gravityDir = 1;
    warningActive = false;
    warnedAt = -1;
    const d = diff();
    if (d.gravityFlip) {
      nextFlipFrame = (d.flipMinFrames + Math.random() * (d.flipMaxFrames - d.flipMinFrames)) | 0;
    } else {
      nextFlipFrame = 0;
    }
  }

  function scheduleNextFlip() {
    const d = diff();
    nextFlipFrame = frame + ((d.flipMinFrames + Math.random() * (d.flipMaxFrames - d.flipMinFrames)) | 0);
  }

  // ---------- INPUT ----------
  // Title-screen buttons (canvas coords)
  const BTN_IZI     = { x: W / 2 - 110, y: 348, w: 220, h: 54, key: 'izi' };
  const BTN_OMEGA   = { x: W / 2 - 110, y: 412, w: 220, h: 54, key: 'omega' };
  const BTN_AGONIST = { x: W / 2 - 110, y: 476, w: 220, h: 54, key: 'agonist' };

  // Skin shop slots
  const SKIN_SLOT_W = 48;
  const SKIN_SLOT_H = 50;
  const SKIN_SLOT_GAP = 5;
  const SKIN_ROW_Y = 225;
  const SKIN_ROW_TOTAL_W = SKIN_KEYS.length * SKIN_SLOT_W + (SKIN_KEYS.length - 1) * SKIN_SLOT_GAP;
  const SKIN_ROW_START_X = (W - SKIN_ROW_TOTAL_W) / 2;
  const SKIN_SLOTS = SKIN_KEYS.map((key, i) => ({
    key,
    x: SKIN_ROW_START_X + i * (SKIN_SLOT_W + SKIN_SLOT_GAP),
    y: SKIN_ROW_Y,
    w: SKIN_SLOT_W,
    h: SKIN_SLOT_H,
  }));

  function pointInRect(x, y, r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  function eventToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top)  * (H / rect.height),
    };
  }

  function selectDifficulty(key) {
    difficulty = key;
    best = +(localStorage.getItem(bestKey()) || 0);
    reset();
    state = STATE.PLAYING;
    cow.vy = FLAP * gravityDir;
    sfx.flap();
  }

  function selectSkin(key) {
    if (!SKINS[key]) return;
    currentSkin = key;
    localStorage.setItem('thocow_skin', key);
    sfx.score();
  }

  function handleTap(clientX, clientY) {
    ensureAudio();
    if (state === STATE.READY) {
      const p = eventToCanvas(clientX, clientY);
      // skin shop slots take priority — they're above the difficulty buttons
      for (const slot of SKIN_SLOTS) {
        if (pointInRect(p.x, p.y, slot)) { selectSkin(slot.key); return; }
      }
      if (pointInRect(p.x, p.y, BTN_IZI))     { selectDifficulty('izi');     return; }
      if (pointInRect(p.x, p.y, BTN_OMEGA))   { selectDifficulty('omega');   return; }
      if (pointInRect(p.x, p.y, BTN_AGONIST)) { selectDifficulty('agonist'); return; }
      // Tap anywhere else on READY does nothing — must pick a slot/button
    } else if (state === STATE.PLAYING) {
      cow.vy = FLAP * gravityDir;
      cow.wing = 1;
      sfx.flap();
    } else if (state === STATE.GAMEOVER) {
      if (gameOverTimer > 30) {
        reset();
        state = STATE.READY;
      }
    }
  }

  window.addEventListener('mousedown', e => {
    e.preventDefault();
    handleTap(e.clientX, e.clientY);
  });
  window.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0] || e.changedTouches[0];
    if (t) handleTap(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (state === STATE.READY) {
        // keyboard quick-start defaults to current selection
        selectDifficulty(difficulty);
      } else if (state === STATE.PLAYING) {
        cow.vy = FLAP * gravityDir;
        cow.wing = 1;
        sfx.flap();
      } else if (state === STATE.GAMEOVER && gameOverTimer > 30) {
        reset();
        state = STATE.READY;
      }
    }
  });

  let gameOverTimer = 0;

  // ---------- UPDATE ----------
  function update() {
    frame++;

    // clouds always move
    for (const c of clouds) {
      c.x -= c.speed;
      if (c.x < -60) { c.x = W + 40; c.y = 40 + Math.random() * 180; c.s = 0.6 + Math.random() * 0.8; }
    }
    // embers drift downward + sway
    for (const e of embers) {
      e.y += e.speed;
      e.x += Math.sin(frame * 0.04 + e.phase) * 0.4 * e.sway;
      if (e.y > H - GROUND_H + 10) { e.y = -5; e.x = Math.random() * W; }
    }

    if (state === STATE.READY) {
      // park the cow off-screen on the title screen — the skin shop already
      // shows live previews of each skin
      cow.y = -200;
      cow.rot = 0;
      return;
    }

    if (state === STATE.PLAYING) {
      const d = diff();

      // Gravity flip schedule (AGONIST only)
      if (d.gravityFlip) {
        const warnStart = nextFlipFrame - d.flipWarningFrames;
        if (!warningActive && frame >= warnStart && frame < nextFlipFrame) {
          warningActive = true;
          warnedAt = frame;
          sfx.warn();
        }
        if (frame >= nextFlipFrame) {
          gravityDir = -gravityDir;
          cow.vy = 0;
          warningActive = false;
          sfx.flip();
          scheduleNextFlip();
        }
      }

      cow.vy += GRAVITY * gravityDir;
      if (cow.vy > MAX_FALL) cow.vy = MAX_FALL;
      if (cow.vy < -MAX_FALL) cow.vy = -MAX_FALL;
      cow.y += cow.vy;
      cow.rot = Math.max(-0.5, Math.min(1.4, cow.vy * 0.08 * gravityDir));

      const speed = currentSpeed();
      grassOffset = (grassOffset + speed) % 30;

      // move pipes
      for (const p of pipes) p.x -= speed;

      // recycle / spawn pipes
      const minSp = d.pipeMinSpacing;
      const maxSp = d.pipeMaxSpacing;
      if (pipes.length && pipes[0].x + PIPE_WIDTH < -20) pipes.shift();
      const last = pipes[pipes.length - 1];
      if (!last) {
        addPipe(W + 100);
      } else if (last.x <= W - minSp) {
        // pick a random spacing in [minSp, maxSp]; clamp so the new pipe
        // never lands on-screen, even if the previous one overshot
        const wanted = minSp + Math.random() * (maxSp - minSp);
        const newX = Math.max(W, last.x + wanted);
        addPipe(newX);
      }

      // scoring
      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_WIDTH < cow.x) {
          p.passed = true;
          score++;
          if (score > best) {
            best = score;
            localStorage.setItem(bestKey(), best);
          }
          sfx.score();
        }
      }

      // collisions
      if (cow.y + cow.h / 2 > H - GROUND_H) {
        cow.y = H - GROUND_H - cow.h / 2;
        die();
      } else if (cow.y - cow.h / 2 < 0) {
        if (d.gravityFlip) {
          // ceiling is deadly in AGONIST
          cow.y = cow.h / 2;
          die();
        } else {
          cow.y = cow.h / 2;
          cow.vy = 0;
        }
      }

      for (const p of pipes) {
        if (collides(cow, p)) { die(); break; }
      }

      cow.wing = Math.max(0, cow.wing - 0.06);
    }

    if (state === STATE.GAMEOVER) {
      gameOverTimer++;
      // Always fall to the ground (regardless of gravity dir during play)
      if (cow.y + cow.h / 2 < H - GROUND_H) {
        cow.vy += GRAVITY;
        cow.y += cow.vy;
        cow.rot = Math.min(1.5, cow.rot + 0.06);
      } else {
        cow.y = H - GROUND_H - cow.h / 2;
      }
    }
  }

  function collides(c, p) {
    const gap = diff().pipeGap;
    const cx1 = c.x - c.w / 2 + 4;
    const cx2 = c.x + c.w / 2 - 4;
    const cy1 = c.y - c.h / 2 + 4;
    const cy2 = c.y + c.h / 2 - 4;
    const px1 = p.x;
    const px2 = p.x + PIPE_WIDTH;
    if (cx2 < px1 || cx1 > px2) return false;
    if (cy1 < p.top) return true;
    if (cy2 > p.top + gap) return true;
    return false;
  }

  function die() {
    if (state !== STATE.PLAYING) return;
    state = STATE.GAMEOVER;
    gameOverTimer = 0;
    // Always fall down on death, even if gravity was inverted at the moment of death
    gravityDir = 1;
    warningActive = false;
    sfx.hit();
    setTimeout(() => sfx.die(), 150);
  }

  // ---------- RENDER ----------
  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y + 4 * s, 14 * s, 0, Math.PI * 2);
    ctx.arc(x - 18 * s, y + 4 * s, 14 * s, 0, Math.PI * 2);
    ctx.arc(x + 6 * s, y - 10 * s, 12 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    const theme = diff().theme;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (theme === 'night') {
      g.addColorStop(0, '#0a0a2e');
      g.addColorStop(0.5, '#1a1448');
      g.addColorStop(1, '#3a1a3a');
    } else if (theme === 'hell') {
      g.addColorStop(0, '#1a0202');
      g.addColorStop(0.5, '#5a0a08');
      g.addColorStop(1, '#c0301a');
    } else {
      g.addColorStop(0, '#87ceeb');
      g.addColorStop(0.65, '#b8e0e8');
      g.addColorStop(1, '#d6efb0');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (theme === 'night') {
      // stars
      for (const s of stars) {
        const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(frame * 0.05 + s.phase));
        ctx.fillStyle = `rgba(255, 255, 230, ${tw})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      // moon
      ctx.save();
      ctx.shadowColor = 'rgba(255,240,200,0.6)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff4cf';
      ctx.beginPath();
      ctx.arc(W - 70, 90, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#1a1448';
      ctx.beginPath();
      ctx.arc(W - 60, 84, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (theme === 'hell') {
      // blood moon / hellsun
      ctx.save();
      ctx.shadowColor = 'rgba(255,80,40,0.9)';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#ff3818';
      ctx.beginPath();
      ctx.arc(W - 70, 95, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // darker spots on the sun
      ctx.fillStyle = '#a01010';
      ctx.beginPath(); ctx.arc(W - 78, 88, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(W - 62, 102, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // falling embers (background atmosphere)
      for (const e of embers) {
        const a = 0.4 + 0.6 * Math.sin(e.phase + frame * 0.1);
        ctx.fillStyle = `rgba(255, ${120 + ((e.x * 13) | 0) % 80}, 30, ${a})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // distant hills / spires
    if (theme === 'hell') {
      // jagged dark spires
      ctx.fillStyle = '#1a0606';
      ctx.beginPath();
      ctx.moveTo(0, H - GROUND_H);
      let x = 0;
      while (x <= W) {
        const peakH = 30 + Math.sin(x * 0.07) * 14 + 24;
        ctx.lineTo(x + 14, H - GROUND_H - peakH);
        ctx.lineTo(x + 28, H - GROUND_H - 6);
        x += 28;
      }
      ctx.lineTo(W, H - GROUND_H);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = theme === 'night' ? '#2a1a3a' : '#8ec56b';
      ctx.beginPath();
      ctx.moveTo(0, H - GROUND_H - 30);
      for (let x = 0; x <= W; x += 40) {
        const y = H - GROUND_H - 30 - Math.sin(x * 0.02) * 18 - 12;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H - GROUND_H);
      ctx.lineTo(0, H - GROUND_H);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = theme === 'night' ? '#1a0f24' : '#7ab85a';
      ctx.beginPath();
      ctx.moveTo(0, H - GROUND_H - 15);
      for (let x = 0; x <= W; x += 30) {
        const y = H - GROUND_H - 15 - Math.cos(x * 0.03 + 1) * 12 - 6;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H - GROUND_H);
      ctx.lineTo(0, H - GROUND_H);
      ctx.closePath();
      ctx.fill();
    }

    if (theme === 'day') {
      for (const c of clouds) drawCloud(c.x, c.y, c.s);
    }
  }

  function drawGround() {
    const theme = diff().theme;
    if (theme === 'hell') {
      // glowing lava top
      ctx.save();
      ctx.shadowColor = 'rgba(255,120,30,0.6)';
      ctx.shadowBlur = 10;
      const lg = ctx.createLinearGradient(0, H - GROUND_H, 0, H - GROUND_H + 30);
      lg.addColorStop(0, '#ffd84a');
      lg.addColorStop(0.4, '#ff7a1a');
      lg.addColorStop(1, '#a01818');
      ctx.fillStyle = lg;
      ctx.fillRect(0, H - GROUND_H, W, 30);
      ctx.restore();
      // bright cracks
      ctx.fillStyle = '#fff080';
      for (let x = -grassOffset * 2; x < W + 30; x += 36) {
        ctx.fillRect(x, H - GROUND_H + 4, 14, 2);
        ctx.fillRect(x + 6, H - GROUND_H + 14, 8, 2);
      }
      // bubbling spots
      for (let i = 0; i < 5; i++) {
        const seed = i * 41 + Math.floor(frame * 0.4);
        const bx = ((seed * 53) % (W + 60)) - 30;
        const cycle = (frame + i * 29) % 90;
        const r = cycle < 40 ? cycle / 8 : 0;
        if (r > 0) {
          ctx.fillStyle = `rgba(255, 220, 80, ${1 - cycle / 40})`;
          ctx.beginPath();
          ctx.arc(bx, H - GROUND_H + 6, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // charred rock below
      const dg = ctx.createLinearGradient(0, H - GROUND_H + 30, 0, H);
      dg.addColorStop(0, '#2a0606');
      dg.addColorStop(1, '#0a0202');
      ctx.fillStyle = dg;
      ctx.fillRect(0, H - GROUND_H + 30, W, GROUND_H - 30);
      // glowing fissures in rock
      ctx.fillStyle = 'rgba(255,80,20,0.6)';
      for (let i = 0; i < 14; i++) {
        const sx = ((i * 53 - grassOffset * 1.5) % W + W) % W;
        const sy = H - GROUND_H + 40 + (i % 4) * 14;
        ctx.fillRect(sx, sy, 4, 2);
      }
      return;
    }

    const night = theme === 'night';
    ctx.fillStyle = night ? '#2d4422' : '#6ab04c';
    ctx.fillRect(0, H - GROUND_H, W, 14);
    ctx.fillStyle = night ? '#1f3318' : '#5aa03c';
    for (let x = -grassOffset; x < W; x += 12) {
      ctx.fillRect(x, H - GROUND_H + 10, 6, 4);
    }
    const dg = ctx.createLinearGradient(0, H - GROUND_H + 14, 0, H);
    if (night) {
      dg.addColorStop(0, '#4a3320');
      dg.addColorStop(1, '#2a1d12');
    } else {
      dg.addColorStop(0, '#c69c6d');
      dg.addColorStop(1, '#8a6240');
    }
    ctx.fillStyle = dg;
    ctx.fillRect(0, H - GROUND_H + 14, W, GROUND_H - 14);
    ctx.fillStyle = night ? 'rgba(20,12,5,0.5)' : 'rgba(80,55,30,0.4)';
    for (let i = 0; i < 20; i++) {
      const sx = ((i * 53 - grassOffset * 1.5) % W + W) % W;
      const sy = H - GROUND_H + 24 + (i % 5) * 12;
      ctx.fillRect(sx, sy, 3, 2);
    }
  }

  // Wooden fence obstacle (replaces flappy pipe)
  function drawFence(p) {
    const d = diff();
    const gap = d.pipeGap;
    drawFenceSegment(p.x, 0, PIPE_WIDTH, p.top, true);            // top hangs from sky
    drawFenceSegment(p.x, p.top + gap, PIPE_WIDTH, H - GROUND_H - (p.top + gap), false);

    if (d.fire) {
      // flames on gap-facing edges
      drawFlames(p.x - 4, p.top, PIPE_WIDTH + 8, +1);              // top fence — flames lick down
      drawFlames(p.x - 4, p.top + gap, PIPE_WIDTH + 8, -1);        // bottom fence — flames rise up
    }
  }

  function drawFlames(x, edgeY, w, dir) {
    // dir: -1 = flames extend upward from edgeY (bottom fence top edge)
    //      +1 = flames extend downward from edgeY (top fence bottom edge)
    const flameCount = 7;
    const flameW = w / flameCount;
    const t = frame * 0.18;

    for (let i = 0; i < flameCount; i++) {
      const cx = x + i * flameW + flameW / 2;
      const flicker = 0.5 + 0.5 * (Math.sin(t + i * 1.7) * 0.5 + Math.sin(t * 1.4 + i * 0.9) * 0.5);
      const baseH = 22 + flicker * 14;

      // outer flame (orange) with glow
      ctx.save();
      ctx.shadowColor = 'rgba(255,120,30,0.7)';
      ctx.shadowBlur = 12;
      drawFlameShape(cx, edgeY, flameW * 1.05, baseH, dir, '#ff6a1a');
      ctx.restore();
      // mid flame (yellow-orange)
      drawFlameShape(cx, edgeY, flameW * 0.75, baseH * 0.78, dir, '#ffb830');
      // inner flame (yellow)
      drawFlameShape(cx, edgeY, flameW * 0.5, baseH * 0.55, dir, '#ffe680');
      // core (near-white)
      drawFlameShape(cx, edgeY, flameW * 0.28, baseH * 0.32, dir, '#ffffd0');
    }

    // floating embers
    for (let i = 0; i < 4; i++) {
      const seed = i * 37 + (frame * 0.6 | 0);
      const px = x + ((seed * 53) % w);
      const offset = ((frame * 1.3 + i * 41) % 60);
      const py = edgeY + dir * -offset; // embers drift toward the gap
      const a = 1 - offset / 60;
      ctx.fillStyle = `rgba(255, ${160 + (i*30)%80}, 60, ${a * 0.8})`;
      ctx.beginPath();
      ctx.arc(px, py, 1.4 + (i % 2) * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFlameShape(cx, baseY, w, h, dir, color) {
    // draw teardrop-ish flame: wide at base, pointy at tip
    const tipY = baseY + dir * h;
    const halfW = w / 2;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx - halfW, baseY);
    // left side curve to tip
    ctx.bezierCurveTo(
      cx - halfW * 0.7, baseY + dir * h * 0.55,
      cx - halfW * 0.2, baseY + dir * h * 0.85,
      cx, tipY
    );
    // right side curve back to base
    ctx.bezierCurveTo(
      cx + halfW * 0.2, baseY + dir * h * 0.85,
      cx + halfW * 0.7, baseY + dir * h * 0.55,
      cx + halfW, baseY
    );
    ctx.closePath();
    ctx.fill();
  }

  function drawFenceSegment(x, y, w, h, flipped) {
    if (h <= 0) return;
    ctx.save();
    // wood color
    const woodLight = '#d4a574';
    const woodMid = '#b58456';
    const woodDark = '#7a5535';
    const woodEdge = '#5a3d24';

    // horizontal rails (2 thick planks)
    const railH = 10;
    const railGap = 18;
    const railTop1 = flipped ? y + h - railGap - railH * 2 - 6 : y + 8;
    const railTop2 = flipped ? y + h - railH - 4 : y + 8 + railH + railGap;

    // vertical posts (3 across the width)
    const postW = 12;
    const postCount = 3;
    const postSpacing = (w - postW * postCount) / (postCount + 1);

    // draw posts first
    for (let i = 0; i < postCount; i++) {
      const px = x + postSpacing + i * (postW + postSpacing);
      const grad = ctx.createLinearGradient(px, 0, px + postW, 0);
      grad.addColorStop(0, woodDark);
      grad.addColorStop(0.5, woodMid);
      grad.addColorStop(1, woodDark);
      ctx.fillStyle = grad;
      ctx.fillRect(px, y, postW, h);

      // wood grain
      ctx.fillStyle = 'rgba(90,55,25,0.35)';
      ctx.fillRect(px + 3, y, 1, h);
      ctx.fillRect(px + 8, y, 1, h);

      // pointy top (only on the "outer" end of each post)
      if (flipped) {
        // post end at bottom of segment (pointing down toward gap)
        ctx.fillStyle = woodMid;
        ctx.beginPath();
        ctx.moveTo(px, y);
        ctx.lineTo(px + postW / 2, y - 8);
        ctx.lineTo(px + postW, y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = woodEdge;
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        // post end at top of segment (pointing up toward gap)
        ctx.fillStyle = woodMid;
        ctx.beginPath();
        ctx.moveTo(px, y);
        ctx.lineTo(px + postW / 2, y - 8);
        ctx.lineTo(px + postW, y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = woodEdge;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // horizontal rails (drawn after posts to overlap)
    function drawRail(ry) {
      if (ry < y || ry + railH > y + h) return;
      const g = ctx.createLinearGradient(0, ry, 0, ry + railH);
      g.addColorStop(0, woodLight);
      g.addColorStop(0.5, woodMid);
      g.addColorStop(1, woodDark);
      ctx.fillStyle = g;
      ctx.fillRect(x - 2, ry, w + 4, railH);
      // wood grain
      ctx.fillStyle = 'rgba(90,55,25,0.3)';
      ctx.fillRect(x - 2, ry + 3, w + 4, 1);
      ctx.fillRect(x - 2, ry + 7, w + 4, 1);
      // dark edge
      ctx.fillStyle = woodEdge;
      ctx.fillRect(x - 2, ry + railH - 1, w + 4, 1);
    }
    drawRail(railTop1);
    drawRail(railTop2);

    // chunky end cap at the open end (toward the gap)
    const capY = flipped ? y : y + h - 6;
    ctx.fillStyle = woodDark;
    ctx.fillRect(x - 4, capY, w + 8, 6);
    ctx.fillStyle = woodEdge;
    ctx.fillRect(x - 4, capY + 5, w + 8, 1);

    ctx.restore();
  }

  // Adorable cow — current game cow
  function drawCow() {
    if (gravityDir === -1) {
      // flip the cow vertically when gravity is inverted
      ctx.save();
      ctx.translate(cow.x, cow.y);
      ctx.scale(1, -1);
      drawCowAt(0, 0, cow.rot, 1, currentSkin, cow.wing, true);
      ctx.restore();
    } else {
      drawCowAt(cow.x, cow.y, cow.rot, 1, currentSkin, cow.wing, true);
    }
  }

  // Skin-aware cow renderer. Reusable for previews in the skin shop.
  function drawCowAt(x, y, rot, scale, skinKey, wingProgress, animated) {
    const skin = SKINS[skinKey] || SKINS.classic;
    const w = 46;
    const h = 34;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(scale, scale);

    // optional aura/glow
    if (skin.extras.includes('glow')) {
      ctx.save();
      ctx.shadowColor = 'rgba(170,120,255,0.7)';
      ctx.shadowBlur = 20;
      ctx.fillStyle = skin.body;
      roundRect(-w / 2, -h / 2, w, h, 12, true, false);
      ctx.restore();
    }
    if (skin.extras.includes('glow-red')) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,40,40,0.7)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = skin.body;
      roundRect(-w / 2, -h / 2, w, h, 12, true, false);
      ctx.restore();
    }

    // shadow underneath
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(0, h / 2 + 4, w / 2.2, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // body
    ctx.fillStyle = skin.body;
    roundRect(-w / 2, -h / 2, w, h, 12, true, false);

    // body outline
    ctx.strokeStyle = skin.outline;
    ctx.lineWidth = 1.5;
    roundRect(-w / 2, -h / 2, w, h, 12, false, true);

    // spots / decorations on body
    ctx.fillStyle = skin.spots;
    const bodySpots = [
      { x: -6, y: -2, rx: 7, ry: 5, rot: -0.3 },
      { x: 6,  y: 6,  rx: 5, ry: 4, rot: 0.4 },
      { x: -14, y: 8, rx: 4, ry: 3, rot: 0.2 },
    ];
    if (skin.spotShape === 'star') {
      for (const s of bodySpots) drawStar(s.x, s.y, (s.rx + s.ry) / 2, skin.spots);
    } else if (skin.spotShape === 'heart') {
      for (const s of bodySpots) drawHeart(s.x, s.y, (s.rx + s.ry) / 1.4, skin.spots);
    } else if (skin.spotShape === 'rivets') {
      const rivets = [
        [-14, -6], [-6, -8], [4, -7], [12, -5],
        [-12, 4], [-2, 6], [8, 5], [14, 0],
        [-16, 10], [16, 9],
      ];
      ctx.fillStyle = skin.spots;
      for (const [rx, ry] of rivets) {
        ctx.beginPath(); ctx.arc(rx, ry, 1.4, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      for (const s of bodySpots) {
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.rx, s.ry, s.rot, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // legs
    ctx.fillStyle = skin.outline;
    ctx.fillRect(-12, h / 2 - 2, 4, 6);
    ctx.fillRect(6, h / 2 - 2, 4, 6);
    ctx.fillRect(-13, h / 2 + 3, 6, 2);
    ctx.fillRect(5, h / 2 + 3, 6, 2);

    // tail
    ctx.strokeStyle = skin.tail;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-w / 2, -2);
    ctx.quadraticCurveTo(-w / 2 - 8, 2, -w / 2 - 6, 8);
    ctx.stroke();
    if (skin.extras.includes('fire-tail')) {
      // flaming tail tuft
      const t = (animated ? frame : 0) * 0.2;
      const flick = 1 + 0.2 * Math.sin(t);
      drawFlameShape(-w / 2 - 6, 8, 8 * flick, 10 * flick, 1, '#ff6a1a');
      drawFlameShape(-w / 2 - 6, 8, 5 * flick, 7 * flick, 1, '#ffd84a');
      drawFlameShape(-w / 2 - 6, 8, 2.5 * flick, 4 * flick, 1, '#ffffd0');
    } else {
      ctx.fillStyle = skin.tail;
      ctx.beginPath();
      ctx.arc(-w / 2 - 6, 9, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // head position
    const headX = w / 2 - 4;
    const headY = -h / 2 + 6;

    // ears (body color base + inner)
    ctx.fillStyle = skin.body;
    ctx.strokeStyle = skin.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(headX - 4, headY - 7, 4, 6, -0.6, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(headX + 8, headY - 7, 4, 6, 0.4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = skin.innerEar;
    ctx.beginPath();
    ctx.ellipse(headX - 4, headY - 6, 1.6, 3, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(headX + 8, headY - 6, 1.6, 3, 0.4, 0, Math.PI * 2);
    ctx.fill();

    // horns / unicorn horn / antenna / devil horns
    drawHorns(headX, headY, skin);

    // rainbow mane (unicow) — drawn behind head circle but in front of horns
    if (skin.extras.includes('rainbow-mane')) {
      const maneColors = ['#ff6b9d', '#ffb84d', '#ffe14d', '#7aff8f', '#5dd1ff', '#bb88ff'];
      for (let i = 0; i < maneColors.length; i++) {
        ctx.fillStyle = maneColors[i];
        ctx.beginPath();
        const mx = headX - 5 + i * 2.4;
        const my = headY - 4 + (i % 2) * 1.5;
        ctx.ellipse(mx, my, 2.5, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // head circle
    ctx.fillStyle = skin.body;
    ctx.strokeStyle = skin.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(headX + 2, headY, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // head spot (or skin-specific decoration)
    if (skin.spotShape === 'star') {
      drawStar(headX - 1, headY - 3, 3.5, skin.spots);
    } else if (skin.spotShape === 'heart') {
      drawHeart(headX - 1, headY - 3, 6, skin.spots);
    } else if (skin.spotShape === 'rivets') {
      ctx.fillStyle = skin.spots;
      ctx.beginPath(); ctx.arc(headX - 4, headY - 2, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(headX + 4, headY + 4, 1.2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = skin.spots;
      ctx.beginPath();
      ctx.ellipse(headX - 2, headY - 3, 4, 3, -0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // snout
    ctx.fillStyle = skin.snout;
    ctx.strokeStyle = skin.outline;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(headX + 5, headY + 4, 6, 4.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // nostrils
    ctx.fillStyle = skin.outline;
    ctx.beginPath(); ctx.arc(headX + 3, headY + 4, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(headX + 7, headY + 4, 0.9, 0, Math.PI * 2); ctx.fill();

    // eye (varies by skin)
    drawEye(headX + 5, headY - 2, skin);

    // wing
    const wingAngle = -0.6 + (wingProgress || 0) * 1.4;
    ctx.save();
    ctx.translate(-2, -2);
    ctx.rotate(wingAngle);
    ctx.fillStyle = skin.wing;
    ctx.strokeStyle = skin.wingOutline;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-4, 0); ctx.lineTo(-9, 3);
    ctx.moveTo(0, 0); ctx.lineTo(-2, 5);
    ctx.moveTo(4, 0); ctx.lineTo(6, 4);
    ctx.stroke();
    ctx.restore();

    // sparkles (cosmetic, animated)
    if (skin.extras.includes('sparkle')) {
      const t = (animated ? frame : 0) * 0.1;
      for (let i = 0; i < 4; i++) {
        const ang = t + i * (Math.PI / 2);
        const r = 22 + Math.sin(t * 2 + i) * 4;
        const sx = Math.cos(ang) * r;
        const sy = Math.sin(ang) * r * 0.6;
        const a = 0.5 + 0.5 * Math.sin(t * 3 + i);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        drawSparkle(sx, sy, 2.5);
      }
    }

    ctx.restore();
  }

  function drawHorns(headX, headY, skin) {
    if (skin.hornsStyle === 'unicorn') {
      // spiral unicorn horn
      ctx.save();
      ctx.translate(headX + 2, headY - 8);
      const grad = ctx.createLinearGradient(0, 0, 0, -14);
      grad.addColorStop(0, '#fff4cf');
      grad.addColorStop(0.5, '#ffd1f0');
      grad.addColorStop(1, '#c8a8ff');
      ctx.fillStyle = grad;
      ctx.strokeStyle = skin.outline;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-3, 0);
      ctx.lineTo(0, -14);
      ctx.lineTo(3, 0);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // spiral lines
      ctx.beginPath();
      ctx.moveTo(-2.4, -2); ctx.lineTo(2.4, -3);
      ctx.moveTo(-1.8, -5); ctx.lineTo(1.8, -6);
      ctx.moveTo(-1.2, -8); ctx.lineTo(1.2, -9);
      ctx.stroke();
      ctx.restore();
      return;
    }
    if (skin.hornsStyle === 'antenna') {
      // single antenna with a blinking LED
      ctx.strokeStyle = skin.outline;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(headX + 2, headY - 6);
      ctx.lineTo(headX + 2, headY - 14);
      ctx.stroke();
      const blink = 0.5 + 0.5 * Math.sin(frame * 0.2);
      ctx.fillStyle = `rgba(255,${60 + 100 * blink},60,1)`;
      ctx.shadowColor = 'rgba(255,40,40,0.8)';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(headX + 2, headY - 15, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      return;
    }
    if (skin.hornsStyle === 'devil') {
      // pointier, curved-out devil horns
      ctx.fillStyle = skin.horns;
      ctx.strokeStyle = skin.outline;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(headX - 4, headY - 6);
      ctx.lineTo(headX - 6, headY - 14);
      ctx.lineTo(headX - 1, headY - 8);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(headX + 8, headY - 6);
      ctx.lineTo(headX + 10, headY - 14);
      ctx.lineTo(headX + 5, headY - 8);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      return;
    }
    // normal horns
    ctx.fillStyle = skin.horns;
    ctx.strokeStyle = skin.outline;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(headX - 1, headY - 10, 2, 4, -0.3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(headX + 5, headY - 10, 2, 4, 0.3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }

  function drawEye(ex, ey, skin) {
    if (skin.eye === 'led-red') {
      ctx.save();
      ctx.shadowColor = 'rgba(255,40,40,0.8)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ff2020';
      ctx.beginPath();
      ctx.arc(ex + 1, ey, 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ex + 1.6, ey - 0.5, 0.8, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    if (skin.eye === 'glow-red') {
      ctx.save();
      ctx.shadowColor = 'rgba(255,40,40,0.9)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.arc(ex + 1, ey, 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#9a0000';
      ctx.beginPath();
      ctx.ellipse(ex + 1.2, ey, 0.7, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    if (skin.eye === 'glow-cyan') {
      ctx.save();
      ctx.shadowColor = 'rgba(110,220,255,0.9)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#a8f0ff';
      ctx.beginPath();
      ctx.arc(ex + 1, ey, 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#0a3050';
      ctx.beginPath();
      ctx.arc(ex + 1.4, ey, 1.2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    // normal eye
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ex, ey, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath();
    ctx.arc(ex + 1, ey, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ex + 1.4, ey - 0.5, 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStar(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
      const a2 = a + Math.PI / 5;
      const x1 = cx + Math.cos(a) * r;
      const y1 = cy + Math.sin(a) * r;
      const x2 = cx + Math.cos(a2) * r * 0.45;
      const y2 = cy + Math.sin(a2) * r * 0.45;
      if (i === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawHeart(cx, cy, size, color) {
    ctx.fillStyle = color;
    const s = size / 10;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 3 * s);
    ctx.bezierCurveTo(cx - 6 * s, cy - 1 * s, cx - 6 * s, cy - 5 * s, cx, cy - 2 * s);
    ctx.bezierCurveTo(cx + 6 * s, cy - 5 * s, cx + 6 * s, cy - 1 * s, cx, cy + 3 * s);
    ctx.closePath();
    ctx.fill();
  }

  function drawSparkle(cx, cy, size) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.lineTo(cx + size * 0.3, cy - size * 0.3);
    ctx.lineTo(cx + size, cy);
    ctx.lineTo(cx + size * 0.3, cy + size * 0.3);
    ctx.lineTo(cx, cy + size);
    ctx.lineTo(cx - size * 0.3, cy + size * 0.3);
    ctx.lineTo(cx - size, cy);
    ctx.lineTo(cx - size * 0.3, cy - size * 0.3);
    ctx.closePath();
    ctx.fill();
  }

  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function drawScore() {
    if (state === STATE.PLAYING || state === STATE.GAMEOVER) {
      drawBigNumber(score, W / 2, 90);
    }
  }

  function drawBigNumber(n, cx, cy) {
    ctx.save();
    ctx.font = 'bold 56px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = String(n);
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText(text, cx, cy);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, cx, cy);
    ctx.restore();
  }

  function drawTitle() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Title
    const y = 110;
    ctx.font = 'bold 64px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText('THOCOW', W / 2, y);
    const grad = ctx.createLinearGradient(0, y - 26, 0, y + 26);
    grad.addColorStop(0, '#fff8c4');
    grad.addColorStop(1, '#f5b3c0');
    ctx.fillStyle = grad;
    ctx.fillText('THOCOW', W / 2, y);

    // subtitle
    ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeText('A vaquinha voadora', W / 2, y + 38);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('A vaquinha voadora', W / 2, y + 38);

    // Skin shop label
    ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText('escolha sua skin', W / 2, 205);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('escolha sua skin', W / 2, 205);

    // Skin slots
    for (const slot of SKIN_SLOTS) drawSkinSlot(slot);

    // Selected skin name
    const sel = SKINS[currentSkin];
    ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText(sel.name, W / 2, 295);
    ctx.fillStyle = '#fff4cf';
    ctx.fillText(sel.name, W / 2, 295);

    // Difficulty label
    ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText('escolha sua dificuldade', W / 2, 332);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('escolha sua dificuldade', W / 2, 332);

    // Buttons
    drawButton(BTN_IZI, 'IZI', '#a8e063', '#5ba83a', 'none');
    drawButton(BTN_OMEGA, 'OMEGA DEDOS', '#ff5722', '#8a1500', 'fire');
    drawButton(BTN_AGONIST, 'AGONIST', '#3a0808', '#100000', 'skull');

    ctx.restore();
  }

  function drawSkinSlot(slot) {
    const selected = slot.key === currentSkin;
    ctx.save();

    // background
    ctx.fillStyle = selected ? 'rgba(255,244,207,0.95)' : 'rgba(255,255,255,0.55)';
    roundRect(slot.x, slot.y, slot.w, slot.h, 8, true, false);

    // border
    ctx.strokeStyle = selected ? '#ffd84a' : '#2a1a10';
    ctx.lineWidth = selected ? 3 : 1.5;
    roundRect(slot.x, slot.y, slot.w, slot.h, 8, false, true);

    // mini cow preview
    const cx = slot.x + slot.w / 2;
    const cy = slot.y + slot.h / 2 + 2;
    drawCowAt(cx, cy, 0, 0.62, slot.key, 0.3, true);

    // sparkle overlay on selected slot
    if (selected) {
      const p = 0.6 + 0.4 * Math.sin(frame * 0.18);
      ctx.strokeStyle = `rgba(255,216,74,${p})`;
      ctx.lineWidth = 3;
      roundRect(slot.x - 1, slot.y - 1, slot.w + 2, slot.h + 2, 9, false, true);
    }

    ctx.restore();
  }

  function drawButton(btn, label, colorTop, colorBottom, decoration) {
    const hot = decoration && decoration !== 'none';
    ctx.save();
    // pulse for hot button
    const pulse = hot ? 1 + Math.sin(frame * 0.15) * 0.04 : 1;
    const cx = btn.x + btn.w / 2;
    const cy = btn.y + btn.h / 2;
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    ctx.translate(-cx, -cy);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(btn.x + 3, btn.y + 5, btn.w, btn.h, 14, true, false);

    // body gradient
    const g = ctx.createLinearGradient(0, btn.y, 0, btn.y + btn.h);
    g.addColorStop(0, colorTop);
    g.addColorStop(1, colorBottom);
    ctx.fillStyle = g;
    roundRect(btn.x, btn.y, btn.w, btn.h, 14, true, false);

    // border (red glow for AGONIST)
    if (decoration === 'skull') {
      ctx.save();
      ctx.shadowColor = 'rgba(255,40,40,0.9)';
      ctx.shadowBlur = 14;
      ctx.strokeStyle = '#ff2a1a';
      ctx.lineWidth = 3;
      roundRect(btn.x, btn.y, btn.w, btn.h, 14, false, true);
      ctx.restore();
    } else {
      ctx.strokeStyle = '#2a1a10';
      ctx.lineWidth = 3;
      roundRect(btn.x, btn.y, btn.w, btn.h, 14, false, true);
    }

    // inner highlight stripe
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    roundRect(btn.x + 6, btn.y + 5, btn.w - 12, 8, 6, true, false);

    // side decorations
    if (decoration === 'fire') {
      drawTinyFlame(btn.x + 28, cy);
      drawTinyFlame(btn.x + btn.w - 28, cy);
    } else if (decoration === 'skull') {
      drawTinySkull(btn.x + 28, cy);
      drawTinySkull(btn.x + btn.w - 28, cy);
    }

    // label
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = decoration === 'skull' ? '#3a0000' : '#2a1a10';
    ctx.strokeText(label, cx, cy + 1);
    ctx.fillStyle = decoration === 'skull' ? '#ffd6c8' : '#ffffff';
    ctx.fillText(label, cx, cy + 1);

    ctx.restore();
  }

  function drawTinySkull(x, y) {
    ctx.save();
    // skull head
    ctx.fillStyle = '#fff1d6';
    ctx.strokeStyle = '#2a0808';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y - 2, 7, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // jaw
    ctx.fillRect(x - 4, y + 3, 8, 4);
    ctx.strokeRect(x - 4, y + 3, 8, 4);
    // eye sockets
    ctx.fillStyle = '#2a0808';
    ctx.beginPath(); ctx.arc(x - 2.6, y - 2, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 2.6, y - 2, 1.8, 0, Math.PI * 2); ctx.fill();
    // teeth lines
    ctx.strokeStyle = '#2a0808';
    ctx.beginPath();
    ctx.moveTo(x - 2, y + 3); ctx.lineTo(x - 2, y + 7);
    ctx.moveTo(x, y + 3); ctx.lineTo(x, y + 7);
    ctx.moveTo(x + 2, y + 3); ctx.lineTo(x + 2, y + 7);
    ctx.stroke();
    ctx.restore();
  }

  function drawTinyFlame(x, y) {
    ctx.save();
    ctx.shadowColor = 'rgba(255,140,40,0.8)';
    ctx.shadowBlur = 6;
    drawFlameShape(x, y + 8, 12, 16, -1, '#ff6a1a');
    drawFlameShape(x, y + 8, 8, 11, -1, '#ffd84a');
    drawFlameShape(x, y + 8, 4, 6, -1, '#ffffd0');
    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    // dim
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // panel
    const panelW = 280;
    const panelH = 220;
    const panelX = (W - panelW) / 2;
    const panelY = 160;

    ctx.fillStyle = '#fff7d6';
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 4;
    roundRect(panelX, panelY, panelW, panelH, 16, true, true);

    // inner divider
    ctx.fillStyle = '#f5b3c0';
    roundRect(panelX + 14, panelY + 14, panelW - 28, 50, 10, true, false);
    ctx.strokeStyle = '#2a1a10';
    ctx.lineWidth = 2;
    roundRect(panelX + 14, panelY + 14, panelW - 28, 50, 10, false, true);

    // GAME OVER
    ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#2a1a10';
    ctx.strokeText('MUUUH!', W / 2, panelY + 40);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('MUUUH!', W / 2, panelY + 40);

    // labels
    ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = '#2a1a10';
    ctx.textAlign = 'left';
    ctx.fillText('Pontos', panelX + 30, panelY + 95);
    ctx.fillText('Recorde', panelX + 30, panelY + 135);

    ctx.textAlign = 'right';
    ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = '#2a1a10';
    ctx.fillText(String(score), panelX + panelW - 30, panelY + 95);
    ctx.fillStyle = '#d4a017';
    ctx.fillText(String(best), panelX + panelW - 30, panelY + 135);

    // new record badge
    if (score > 0 && score === best && score > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#d4a017';
      ctx.fillText('NOVO RECORDE!', W / 2, panelY + 165);
    }

    // restart prompt
    if (gameOverTimer > 30) {
      const pulse = 0.5 + Math.sin(frame * 0.15) * 0.5;
      ctx.globalAlpha = 0.5 + pulse * 0.5;
      ctx.textAlign = 'center';
      ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#2a1a10';
      ctx.strokeText('Toque para jogar de novo', W / 2, panelY + panelH + 30);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Toque para jogar de novo', W / 2, panelY + panelH + 30);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function render() {
    drawBackground();
    for (const p of pipes) drawFence(p);
    drawGround();
    drawCow();

    if (state === STATE.PLAYING && warningActive) drawGravityWarning();

    if (state === STATE.READY) drawTitle();
    drawScore();
    if (state === STATE.GAMEOVER) drawGameOver();
  }

  function drawGravityWarning() {
    ctx.save();
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.5);
    // pulsing red border
    ctx.strokeStyle = `rgba(255,30,30,${0.4 + pulse * 0.5})`;
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, W - 10, H - 10);
    // inner glow
    ctx.shadowColor = 'rgba(255,40,40,0.9)';
    ctx.shadowBlur = 20;
    ctx.strokeStyle = `rgba(255,90,40,${0.3 + pulse * 0.4})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(12, 12, W - 24, H - 24);
    ctx.shadowBlur = 0;

    // warning text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const scale = 1 + pulse * 0.15;
    ctx.translate(W / 2, 180);
    ctx.scale(scale, scale);
    ctx.font = 'bold 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#3a0000';
    ctx.strokeText('!! GRAVIDADE !!', 0, 0);
    ctx.fillStyle = `rgba(255, ${100 + pulse * 100}, 40, 1)`;
    ctx.fillText('!! GRAVIDADE !!', 0, 0);
    ctx.restore();
  }

  // ---------- LOOP (fixed timestep, frame-rate independent) ----------
  const FIXED_DT = 1000 / 60; // logical update rate: 60 Hz
  let lastTime = performance.now();
  let accumulator = 0;

  function loop(now) {
    let frameTime = now - lastTime;
    lastTime = now;
    // Clamp huge gaps (tab was in background, etc.) to avoid spiral of death
    if (frameTime > 250) frameTime = 250;
    accumulator += frameTime;
    // Catch-up: run as many fixed updates as needed
    let safety = 5;
    while (accumulator >= FIXED_DT && safety-- > 0) {
      update();
      accumulator -= FIXED_DT;
    }
    render();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
